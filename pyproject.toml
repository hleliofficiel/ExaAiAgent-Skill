[project]
name = "exaaiagent-skill"
version = "1.0.0"
description = "Independent AI-agent skill package for authorized security assessment workflows with ExaAiAgent 3.0.1"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ExaAi" }]
keywords = ["security", "pentest", "skill", "agent", "exaaiagent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
